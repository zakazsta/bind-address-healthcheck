name: Bug report
description: Report a reproducible bind verification problem using synthetic data
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Never include credentials, customer data, private addresses or production logs.
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction
      description: Include a minimal synthetic ss snapshot and the exact command.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
