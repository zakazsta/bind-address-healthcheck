<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Internal service public by accident</title>
  <desc id="description">A dark technical card showing an expected localhost address and a public bind blocked before release.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151923"/>
      <stop offset="1" stop-color="#0d1017"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="#090b10"/>
  <circle cx="1035" cy="85" r="170" fill="#2dd4bf" opacity="0.09" filter="url(#glow)"/>
  <circle cx="110" cy="590" r="210" fill="#60a5fa" opacity="0.08" filter="url(#glow)"/>
  <rect x="64" y="58" width="1072" height="514" rx="28" fill="url(#panel)" stroke="#273244" stroke-width="2"/>
  <text x="108" y="128" fill="#7dd3fc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" letter-spacing="3">LINUX OPERATIONS PATTERN</text>
  <text x="108" y="213" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="58" font-weight="700">Internal service.</text>
  <text x="108" y="279" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="58" font-weight="700">Public by accident?</text>
  <rect x="108" y="326" width="984" height="142" rx="18" fill="#080b11" stroke="#273244"/>
  <circle cx="150" cy="370" r="10" fill="#34d399"/>
  <text x="178" y="379" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24">expected</text>
  <text x="350" y="379" fill="#f8fafc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24">127.0.0.1:8080</text>
  <circle cx="150" cy="425" r="10" fill="#fb7185"/>
  <text x="178" y="434" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24">found</text>
  <text x="350" y="434" fill="#f8fafc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24">0.0.0.0:8080</text>
  <text x="770" y="434" fill="#fb7185" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" font-weight="700">BLOCKED</text>
  <text x="108" y="516" fill="#94a3b8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="25">Verify the real bind address before release.</text>
</svg>
